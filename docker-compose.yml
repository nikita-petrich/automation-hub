# =============================================================================
# automation-hub — self-hosted n8n (SQLite)
# =============================================================================
# TLS + routing are handled by your EXISTING reverse proxy
# (valian/docker-nginx-auto-ssl). n8n joins that proxy's shared Docker network
# and is reached at  n8n:5678  — add this to your proxy's SITES:
#     SITES: "...;${DOMAIN}=n8n:5678"
#     ALLOWED_DOMAINS: "...;${DOMAIN}"
#
# n8n is published on 127.0.0.1:5678 ONLY (loopback) so the on-host deploy
# script can reach the n8n API; it is never exposed to the internet directly.
# All configuration comes from .env.
# =============================================================================

services:
  n8n:
    image: n8nio/n8n:${N8N_IMAGE_TAG:-2.31.4}
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678" # loopback only — for `npm run deploy` on the host
    environment:
      # --- Public URL / reverse-proxy awareness ---------------------------
      N8N_HOST: ${DOMAIN}
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      WEBHOOK_URL: https://${DOMAIN}/
      N8N_EDITOR_BASE_URL: https://${DOMAIN}/
      N8N_PROXY_HOPS: "1" # behind exactly one proxy (nginx-auto-ssl)

      # --- Locale / time --------------------------------------------------
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin

      # --- Security -------------------------------------------------------
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Nodes must NOT be able to read the process env: N8N_ENCRYPTION_KEY lives
      # there, and with it the stored Google OAuth refresh token can be
      # decrypted. Anyone who can edit a workflow could otherwise exfiltrate it
      # with one line (`return [{json:{k: $env.N8N_ENCRYPTION_KEY}}]`).
      # Runtime config is injected at deploy time by scripts/deploy.ts instead,
      # and `npm run validate` fails on any workflow that reads $env.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      # Same idea for the filesystem: keep nodes away from ~/.n8n (config file,
      # SQLite database) so the key cannot be read around the flag above.
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"

      # --- Public REST API (used by scripts/deploy.ts) --------------------
      N8N_PUBLIC_API_DISABLED: "false"

      # --- Task runner (Code node execution) ------------------------------
      N8N_RUNNERS_ENABLED: "true"

      # --- Privacy / housekeeping -----------------------------------------
      N8N_DIAGNOSTICS_ENABLED: "false" # no telemetry
      N8N_PERSONALIZATION_ENABLED: "false" # skip the personalization survey
      EXECUTIONS_DATA_PRUNE: "true" # don't keep execution history forever
      EXECUTIONS_DATA_MAX_AGE: "336" # prune runs older than 336h (14 days)

      # NOTE: CALENDAR_ID / SHOW_BIRTH_YEAR / BIRTHDAY_SYNC_SCHEDULE are
      # deliberately NOT passed to the container. They are baked into the
      # workflow by scripts/deploy.ts at deploy time, which is what allows
      # N8N_BLOCK_ENV_ACCESS_IN_NODE above to stay "true". They remain in .env
      # because that is where the deploy script reads them from.
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - proxy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5678/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  n8n_data:

networks:
  # The shared network created by your reverse-proxy stack. Set PROXY_NETWORK in
  # .env to its actual name (your reverse-proxy compose defaults to example-net).
  proxy:
    external: true
    name: ${PROXY_NETWORK:-example-net}
