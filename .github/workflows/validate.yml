# Validation only — NO deploy, NO SSH, NO secrets required.
# Parses/validates every workflow JSON, type-checks the scripts, verifies the
# Code node is in sync with lib/, and runs the lib unit tests. Deployment to n8n
# is a deliberate step (scripts/deploy.ts), never done from CI.
name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# This job needs nothing but the code. Without an explicit block the token
# inherits the repository default, which may include write scopes — a
# compromised action step could then push to the repo.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit SHA (immutable); the trailing comment is
      # the human-readable version. Dependabot bumps these (see dependabot.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      # `npm ci` installs exactly the tree in package-lock.json (with integrity
      # hashes); --ignore-scripts blocks install lifecycle hooks, which matters
      # here because this job also runs on pull requests from forks.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check the scripts
        run: npm run typecheck

      - name: Validate workflows (JSON, schema, lib sync)
        run: npm run validate

      - name: Run unit tests
        run: npm test
