# Continuous deployment — deploy the WHOLE stack to the VPS.
# =============================================================================
# On push to `main` (or manual dispatch), GitHub Actions:
#   1. validates the workflows (safety gate: typecheck + validate + tests),
#   2. copies the repo onto the VPS over SSH (tar stream),
#   3. renders the VPS .env from the `production` Environment's secrets,
#   4. starts the stack on the VPS (docker compose up -d via vps-deploy.sh),
#   5. deploys the workflows into n8n from the runner over an SSH tunnel to the
#      VPS's loopback port (so the VPS needs only Docker — no Node, no rsync,
#      and no dependency on the public TLS certificate).
#
# ALL configuration lives in the GitHub `production` Environment as SECRETS — you
# never edit .env on the server by hand; the pipeline writes it from these:
#
#   Required secrets:
#     VPS_SSH_KEY  private deploy key    DOMAIN         n8n hostname
#     VPS_HOST     server IP/hostname    PROXY_NETWORK  reverse-proxy network name
#     VPS_USER     ssh user              CALENDAR_ID    target Google calendar
#     N8N_ENCRYPTION_KEY  openssl rand   N8N_API_KEY    n8n Public API key (step 6)
#     GOOGLE_OAUTH_CRED_ID  n8n credential id (step 6)
#     VPS_SSH_HOST_KEY  pinned host key (ssh-keyscan -p <port> <host>) — the deploy
#                       FAILS without it rather than trusting an unverified key.
#   Optional secrets (defaults): BIRTHDAY_SYNC_SCHEDULE=0 6 * * *, SHOW_BIRTH_YEAR=true,
#     N8N_IMAGE_TAG=2.31.4, VPS_PORT=22, VPS_APP_DIR=automation-hub
#
# N8N_API_KEY + GOOGLE_OAUTH_CRED_ID come from the n8n UI (one-time browser step);
# until N8N_API_KEY is set, the stack still comes up and the workflow deploy is
# skipped with a clear message. See docs/ci-cd.md.
# =============================================================================
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "workflows/**"
      - "lib/**"
      - "scripts/**"
      - "docker-compose.yml"
      - ".env.example"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

# The deploy reads the repo and pushes to the VPS over SSH; it never writes back
# to GitHub. Without an explicit block the token inherits the repository default,
# which may include write scopes.
permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit SHA (immutable); the trailing comment is
      # the human-readable version. Dependabot bumps these (see dependabot.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run validate
      - run: npm test # same gate as validate.yml — don't let prod deploy on a weaker check

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    # A hung SSH call would otherwise sit in the `deploy-vps` concurrency group
    # for GitHub's 6h default and block every later deploy behind it.
    timeout-minutes: 15
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || 'automation-hub' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      # Dependencies are installed here, up front: before the deploy key is on
      # disk, before the SSH tunnel exists, and without any of the step-scoped
      # secrets (VPS_SSH_KEY, N8N_ENCRYPTION_KEY, N8N_API_KEY) in the
      # environment. --ignore-scripts additionally blocks install lifecycle
      # hooks; tsx/esbuild resolve their platform binary through
      # optionalDependencies and do not need them.
      - name: Install dependencies (before any step-scoped secret is in scope)
        run: npm ci --ignore-scripts

      # The host key is PINNED from a secret, never learned on the fly. Without it
      # an attacker able to redirect runner -> VPS traffic would receive the
      # rendered .env (encryption key + API key) and a shell as the deploy user.
      # Capture the value once, from a trusted network:
      #     ssh-keyscan -p <VPS_PORT> <VPS_HOST>
      # and store the output verbatim as the VPS_SSH_HOST_KEY secret. Use the same
      # host string as VPS_HOST — known_hosts entries are keyed on it (a non-default
      # port is recorded as `[host]:port`).
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          if [ -z "$VPS_SSH_HOST_KEY" ]; then
            echo "::error::VPS_SSH_HOST_KEY is not set in the 'production' environment. Capture it with: ssh-keyscan -p ${VPS_PORT} <VPS_HOST>"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Belt and braces: even if a later step forgets -o, ssh must not fall
          # back to prompting or to trust-on-first-use.
          printf 'Host *\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Sync repository to the VPS (tar over SSH; keeps the rendered .env)
        run: |
          tar czf - \
            --exclude='./.git' --exclude='./node_modules' \
            --exclude='./backups' --exclude='./dist' --exclude='./.env' . \
          | ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
              "mkdir -p '$VPS_APP_DIR' && tar xzf - -C '$VPS_APP_DIR'"

      - name: Render .env on the VPS from the production Environment
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          N8N_IMAGE_TAG: ${{ secrets.N8N_IMAGE_TAG }}
          PROXY_NETWORK: ${{ secrets.PROXY_NETWORK }}
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
          BIRTHDAY_SYNC_SCHEDULE: ${{ secrets.BIRTHDAY_SYNC_SCHEDULE }}
          SHOW_BIRTH_YEAR: ${{ secrets.SHOW_BIRTH_YEAR }}
          GOOGLE_OAUTH_CRED_ID: ${{ secrets.GOOGLE_OAUTH_CRED_ID }}
          N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          if [ -z "$DOMAIN" ] || [ -z "$N8N_ENCRYPTION_KEY" ]; then
            echo "::error::Missing required config. Set the DOMAIN and N8N_ENCRYPTION_KEY secrets in the 'production' environment."
            exit 1
          fi
          # Pipe the rendered .env straight into `install -m 600` on the VPS: the
          # file is created 0600 atomically — no world-readable window (no scp +
          # later chmod), and no plaintext secret tempfile lingers on the runner.
          {
            echo "DOMAIN=$DOMAIN"
            echo "N8N_IMAGE_TAG=${N8N_IMAGE_TAG:-2.31.4}"
            echo "PROXY_NETWORK=${PROXY_NETWORK:-example-net}"
            echo "N8N_ENCRYPTION_KEY=$N8N_ENCRYPTION_KEY"
            echo "N8N_API_KEY=$N8N_API_KEY"
            echo "N8N_API_URL=http://127.0.0.1:5678"
            echo "GOOGLE_OAUTH_CRED_ID=$GOOGLE_OAUTH_CRED_ID"
            echo "CALENDAR_ID=$CALENDAR_ID"
            echo "BIRTHDAY_SYNC_SCHEDULE=${BIRTHDAY_SYNC_SCHEDULE:-0 6 * * *}"
            echo "SHOW_BIRTH_YEAR=${SHOW_BIRTH_YEAR:-true}"
          } | ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
                "install -m 600 /dev/stdin '$VPS_APP_DIR/.env'"

      - name: Start stack on the VPS
        run: |
          ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_APP_DIR' && bash scripts/vps-deploy.sh"

      - name: Do we have an API key?
        id: apikey
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          if [ -z "$N8N_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "N8N_API_KEY not set — n8n is up; add the secret and re-run to import workflows."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open SSH tunnel to n8n
        if: steps.apikey.outputs.present == 'true'
        run: |
          # Tunnel runner:5678 -> VPS 127.0.0.1:5678 (n8n's loopback-published
          # port), reaching the n8n API directly over SSH — independent of the
          # public TLS cert (Node would reject an untrusted/self-signed one).
          # A control socket makes teardown deterministic (see cleanup step).
          ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" \
            -M -S ~/.ssh/n8n-tunnel.sock \
            -o ExitOnForwardFailure=yes -f -N \
            -L 127.0.0.1:5678:127.0.0.1:5678 "$VPS_USER@$VPS_HOST"

      # CALENDAR_ID and SHOW_BIRTH_YEAR are needed HERE, on the runner: they are
      # baked into the workflow by scripts/deploy.ts instead of being read from
      # $env inside n8n, so the container can block env access to the nodes.
      - name: Deploy workflows into n8n
        if: steps.apikey.outputs.present == 'true'
        env:
          N8N_API_URL: http://127.0.0.1:5678
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          GOOGLE_OAUTH_CRED_ID: ${{ secrets.GOOGLE_OAUTH_CRED_ID }}
          BIRTHDAY_SYNC_SCHEDULE: ${{ secrets.BIRTHDAY_SYNC_SCHEDULE }}
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
          SHOW_BIRTH_YEAR: ${{ secrets.SHOW_BIRTH_YEAR }}
        run: |
          # Dependencies were installed up front (before secrets/tunnel); the
          # tunnel is already open. Just run the one-way deploy.
          npm run deploy

      - name: Close SSH tunnel
        if: always() && steps.apikey.outputs.present == 'true'
        run: |
          ssh -S ~/.ssh/n8n-tunnel.sock -O exit "$VPS_USER@$VPS_HOST" 2>/dev/null || true
