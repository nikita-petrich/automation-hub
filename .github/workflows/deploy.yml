# Continuous deployment — deploy the WHOLE stack to the VPS.
# =============================================================================
# On push to `main` (or manual dispatch), GitHub Actions:
#   1. validates the workflows (safety gate),
#   2. copies the repo onto the VPS over SSH (tar stream),
#   3. renders the VPS .env from the `production` Environment's secrets,
#   4. starts the stack on the VPS (docker compose up -d via vps-deploy.sh),
#   5. deploys the workflows into n8n from the runner via the public API
#      (so the VPS needs only Docker — no Node, no rsync).
#
# ALL configuration lives in the GitHub `production` Environment as SECRETS — you
# never edit .env on the server by hand; the pipeline writes it from these:
#
#   Required secrets:
#     VPS_SSH_KEY  private deploy key    DOMAIN         n8n hostname
#     VPS_HOST     server IP/hostname    PROXY_NETWORK  reverse-proxy network name
#     VPS_USER     ssh user              CALENDAR_ID    target Google calendar
#     N8N_ENCRYPTION_KEY  openssl rand   N8N_API_KEY    n8n Public API key (step 6)
#     GOOGLE_OAUTH_CRED_ID  n8n credential id (step 6)
#   Optional secrets (defaults): BIRTHDAY_SYNC_SCHEDULE=0 6 * * *, SHOW_BIRTH_YEAR=true,
#     N8N_IMAGE_TAG=2.31.4, VPS_PORT=22, VPS_APP_DIR=automation-hub
#
# N8N_API_KEY + GOOGLE_OAUTH_CRED_ID come from the n8n UI (one-time browser step);
# until N8N_API_KEY is set, the stack still comes up and the workflow deploy is
# skipped with a clear message. See docs/ci-cd.md.
# =============================================================================
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "workflows/**"
      - "lib/**"
      - "scripts/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run validate

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || 'automation-hub' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync repository to the VPS (tar over SSH; keeps the rendered .env)
        run: |
          tar czf - \
            --exclude='./.git' --exclude='./node_modules' \
            --exclude='./backups' --exclude='./dist' --exclude='./.env' . \
          | ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
              "mkdir -p '$VPS_APP_DIR' && tar xzf - -C '$VPS_APP_DIR'"

      - name: Render .env on the VPS from the production Environment
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          N8N_IMAGE_TAG: ${{ secrets.N8N_IMAGE_TAG }}
          PROXY_NETWORK: ${{ secrets.PROXY_NETWORK }}
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
          BIRTHDAY_SYNC_SCHEDULE: ${{ secrets.BIRTHDAY_SYNC_SCHEDULE }}
          SHOW_BIRTH_YEAR: ${{ secrets.SHOW_BIRTH_YEAR }}
          GOOGLE_OAUTH_CRED_ID: ${{ secrets.GOOGLE_OAUTH_CRED_ID }}
          N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          if [ -z "$DOMAIN" ] || [ -z "$N8N_ENCRYPTION_KEY" ]; then
            echo "::error::Missing required config. Set the DOMAIN variable and the N8N_ENCRYPTION_KEY secret in the 'production' environment."
            exit 1
          fi
          tmp="$(mktemp)"
          {
            echo "DOMAIN=$DOMAIN"
            echo "N8N_IMAGE_TAG=${N8N_IMAGE_TAG:-2.31.4}"
            echo "PROXY_NETWORK=${PROXY_NETWORK:-example-net}"
            echo "N8N_ENCRYPTION_KEY=$N8N_ENCRYPTION_KEY"
            echo "N8N_API_KEY=$N8N_API_KEY"
            echo "N8N_API_URL=http://127.0.0.1:5678"
            echo "GOOGLE_OAUTH_CRED_ID=$GOOGLE_OAUTH_CRED_ID"
            echo "CALENDAR_ID=$CALENDAR_ID"
            echo "BIRTHDAY_SYNC_SCHEDULE=${BIRTHDAY_SYNC_SCHEDULE:-0 6 * * *}"
            echo "SHOW_BIRTH_YEAR=${SHOW_BIRTH_YEAR:-true}"
          } > "$tmp"
          scp -i ~/.ssh/id_deploy -P "$VPS_PORT" "$tmp" "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/.env"
          ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "chmod 600 '$VPS_APP_DIR/.env'"
          rm -f "$tmp"

      - name: Start stack on the VPS
        run: |
          ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_APP_DIR' && bash scripts/vps-deploy.sh"

      - name: Deploy workflows into n8n (runner → public API)
        env:
          N8N_API_URL: https://${{ secrets.DOMAIN }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          GOOGLE_OAUTH_CRED_ID: ${{ secrets.GOOGLE_OAUTH_CRED_ID }}
          BIRTHDAY_SYNC_SCHEDULE: ${{ secrets.BIRTHDAY_SYNC_SCHEDULE }}
        run: |
          if [ -z "$N8N_API_KEY" ]; then
            echo "N8N_API_KEY not set — n8n is up; add the secret and re-run to import workflows."
            exit 0
          fi
          npm install --no-audit --no-fund
          npm run deploy
